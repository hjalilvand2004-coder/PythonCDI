{% extends "mobile/base.html" %}
{% set title = "رضایت‌سنجی ثبت شد" %}

{% block content %}
<div style="text-align:center;padding:40px 20px;">
  <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#12938d);margin:0 auto 20px;display:grid;place-items:center;">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="40" height="40"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h2 style="font-size:20px;color:#16a34a;margin-bottom:8px;">از شما متشکریم!</h2>
  <p style="font-size:14px;color:#64748b;margin-bottom:24px;">رضایت‌سنجی شما با موفقیت ثبت شد.</p>

  <div class="m-card" style="display:inline-block;text-align:center;padding:24px 40px;">
    <div style="font-size:48px;font-weight:700;color:{% if score >= 4 %}#16a34a{% elif score >= 3 %}#f59e0b{% else %}#dc2626{% endif %};">
      {{ score }}
    </div>
    <div style="font-size:14px;color:#64748b;">از ۵</div>
    <div style="margin-top:8px;">
      {% for i in range(5) %}
      <span style="font-size:24px;color:{% if i < score|round %}#f59e0b{% else %}#dbe3ec{% endif %};">⭐</span>
      {% endfor %}
    </div>
  </div>

  <div style="margin-top:24px;">
    <a href="/m" class="m-btn outline">← بازگشت به خانه</a>
  </div>
</div>
{% endblock %}
